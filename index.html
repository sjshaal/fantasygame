<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Potion & Prophecy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Lora', serif; }
    .font-display, h1, h2, h3 { font-family: 'Cinzel', serif; }

    /* ── Video background ─────────────────────────────── */
    #bg-video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      transition: filter 1.4s ease;
    }
    /* Mood-tinted overlay sits between video and UI */
    #bg-overlay {
      position: fixed; inset: 0;
      z-index: -1;
      transition: background 1.4s ease;
    }

    /* ── Animations ─────────────────────────────────── */
    @keyframes cauldronGlow {
      0%,100% { box-shadow: 0 0 18px rgba(160,90,20,.5), 0 0 45px rgba(210,150,40,.2); }
      50%      { box-shadow: 0 0 34px rgba(160,90,20,.8), 0 0 80px rgba(210,150,40,.4);  }
    }
    @keyframes bubbleRise {
      0%   { transform: translateY(0) scale(1);       opacity: .75; }
      100% { transform: translateY(-54px) scale(.3);  opacity: 0;   }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    /* Luma sprite */
@keyframes lumaFloat {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-5px) scale(1.05); }
    }
    @keyframes lumaGlow {
      0%,100% { box-shadow: 0 0 8px 3px rgba(120,180,255,0.55), 0 0 22px 5px rgba(100,160,255,0.2); }
      50%      { box-shadow: 0 0 16px 5px rgba(150,210,255,0.85), 0 0 38px 10px rgba(100,160,255,0.4); }
    }
    @keyframes lumaAppear {
      from { opacity:0; transform:scale(0) translateY(12px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    #luma-sprite { cursor:pointer; transition: transform .15s; }
    #luma-sprite:hover { transform: scale(1.15) translateY(-2px) !important; }
    #luma-sprite.luma-float {
      animation: lumaFloat 3s ease-in-out infinite, lumaGlow 3s ease-in-out infinite;
    }

    @keyframes brewShake {
      0%,100% { transform: scale(1) rotate(0deg);     }
      20%      { transform: scale(1.09) rotate(-5deg); }
      40%      { transform: scale(1.09) rotate(5deg);  }
      60%      { transform: scale(1.06) rotate(-3deg); }
      80%      { transform: scale(1.03) rotate(2deg);  }
    }

    .cauldron-glow  { animation: cauldronGlow 3s ease-in-out infinite; }
    .brew-shake     { animation: brewShake .65s ease-in-out; }
    .bubble-anim    { animation: bubbleRise var(--dur,2s) ease-out var(--del,0s) infinite; }
    .fade-up        { animation: fadeUp .35s ease-out forwards; }

    /* Scrollbar */
    ::-webkit-scrollbar       { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(232,213,163,.5); }
    ::-webkit-scrollbar-thumb { background: #8b6040; border-radius: 4px; }

    /* ── Frosted parchment panels ─────────────────────── */
    /*  backdrop-filter lets the moving video subtly show  */
    .glass-parchment {
      background: rgba(250,238,208,0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .glass-dark {
      background: rgba(35,15,5,0.72);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .glass-nav {
      background: rgba(55,22,6,0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Tab button */
    .tab-btn { transition: background .2s, color .2s, border-color .2s; border-bottom: 3px solid transparent; }
    .tab-btn.active {
      background: rgba(250,238,208,0.9) !important;
      color: #4a2e10 !important;
      border-bottom-color: #d4a73a !important;
    }

    /* Ingredient card */
    .ing-card { transition: transform .18s, box-shadow .18s; cursor: pointer; }
    .ing-card:hover:not(.ing-disabled) { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    .ing-card.ing-selected { outline: 2px solid #d4a73a; box-shadow: 0 0 0 4px rgba(212,167,58,.3); }
    .ing-card.ing-disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }

    /* Journal */
    .journal-blur { filter: blur(3px); user-select: none; pointer-events: none; }

    /* Location hero (Explore tab) */
    #location-hero {
      position: relative;
      min-height: 160px;
      border-radius: 1rem;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    #location-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(15,5,0,.85) 0%, rgba(15,5,0,.3) 60%, transparent 100%);
    }
  </style>
</head>

<body class="min-h-screen text-[#4a2e10]">

<!-- ── Background video ────────────────────────────── -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="assets/workshop.mp4" type="video/mp4"/>
</video>
<!-- Mood overlay — JS changes this per location/tab -->
<div id="bg-overlay" style="background:rgba(25,10,3,0.50);"></div>

<!-- ════════════════ HEADER ════════════════ -->
<header class="glass-dark border-b border-[#d4a73a]/40">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-6">
    <!-- Title -->
    <div class="shrink-0">
      <h1 class="font-display text-xl md:text-2xl text-[#f5e6c8] tracking-widest drop-shadow-lg cursor-pointer hover:text-[#d4a73a] transition-colors" onclick="goHome()">🧪 Potion &amp; Prophecy</h1>
    </div>

    <!-- Luma — hidden until summoned via Dream Tincture -->
    <div id="luma-sprite" class="hidden shrink-0" onclick="lumaWhisper()" title="Luma — click to hear her whisper">
      <video autoplay muted loop playsinline
             class="rounded-full object-cover luma-float"
             style="width:52px;height:52px;border:2px solid rgba(140,200,255,0.7);animation:lumaFloat 3s ease-in-out infinite,lumaGlow 3s ease-in-out infinite;">
        <source src="assets/creature.mp4" type="video/mp4"/>
      </video>
    </div>

    <!-- Chronicle log — inline next to title -->
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between mb-0.5">
        <span class="font-display text-xs tracking-widest text-[#d4a73a]">✦ CHRONICLE ✦</span>
        <button onclick="clearLog()" class="text-xs text-[#7a5030] hover:text-[#d4a73a] transition-colors ml-2">Clear</button>
      </div>
      <div id="action-log" class="h-10 overflow-y-auto space-y-0.5 pr-1"></div>
    </div>

    <!-- Save/Load/New -->
    <div class="flex gap-2 shrink-0">
      <button onclick="saveGame()" class="text-xs px-3 py-1.5 rounded border border-[#d4a73a] text-[#d4a73a] hover:bg-[#d4a73a] hover:text-[#3a1808] transition-colors font-display tracking-wide">Save</button>
      <button onclick="loadGame()" class="text-xs px-3 py-1.5 rounded border border-[#d4a73a] text-[#d4a73a] hover:bg-[#d4a73a] hover:text-[#3a1808] transition-colors font-display tracking-wide">Load</button>
      <button onclick="newGame()" class="text-xs px-3 py-1.5 rounded border border-[#a06050] text-[#d09080] hover:bg-[#a06050] hover:text-[#f5e6c8] transition-colors font-display tracking-wide">New</button>
      <button onclick="devFill()" title="Dev: fill all ingredients" class="text-xs px-2 py-1.5 rounded border border-white/10 text-white/20 hover:text-[#d4a73a] hover:border-[#d4a73a]/40 transition-colors">⚗️</button>
    </div>
  </div>
</header>

<!-- ════════════════ NAV TABS ════════════════ -->
<nav class="glass-nav border-b-2 border-[#d4a73a]">
  <div class="max-w-5xl mx-auto px-4 flex overflow-x-auto">
    <button class="tab-btn px-4 md:px-6 py-3 font-display text-sm tracking-wider text-[#d4b080] hover:text-[#f5e6c8]" data-tab="workshop"  onclick="switchTab('workshop')">🧪 Workshop</button>
    <button class="tab-btn px-4 md:px-6 py-3 font-display text-sm tracking-wider text-[#d4b080] hover:text-[#f5e6c8]"        data-tab="inventory" onclick="switchTab('inventory')">🎒 Inventory</button>
    <button class="tab-btn px-4 md:px-6 py-3 font-display text-sm tracking-wider text-[#d4b080] hover:text-[#f5e6c8]"        data-tab="explore"   onclick="switchTab('explore')">🗺 Explore</button>
    <button class="tab-btn px-4 md:px-6 py-3 font-display text-sm tracking-wider text-[#d4b080] hover:text-[#f5e6c8]"        data-tab="journal"   onclick="switchTab('journal')">📖 Journal</button>
  </div>
</nav>

<!-- ════════════════ MAIN ════════════════ -->
<main class="max-w-5xl mx-auto px-4 py-6">

  <!-- ── LANDING — full video view shown before any tab is selected ── -->
  <div id="landing" style="min-height:calc(100vh - 180px);"></div>

  <!-- ── WORKSHOP ──────────────────────────────── -->
  <div id="tab-workshop" class="tab-content hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Left: ingredient shelf -->
      <div>
        <div class="glass-parchment rounded-xl border border-[#d4b080]/60 p-5">
          <h2 class="font-display text-lg text-[#6b3410] mb-1 pb-2 border-b border-[#d4b080]">✦ Ingredient Shelf</h2>
          <p class="text-xs text-[#7a5030] italic mb-4">Click to add to cauldron (max 3). Click again to remove.</p>
          <div id="workshop-ingredients" class="grid grid-cols-2 gap-2"></div>
        </div>
      </div>

      <!-- Right: cauldron + recipes -->
      <div class="space-y-4">
        <div class="glass-parchment rounded-xl border border-[#d4b080]/60 p-5">
          <h2 class="font-display text-lg text-[#6b3410] mb-2 pb-2 border-b border-[#d4b080]">✦ The Cauldron</h2>
          <div class="flex flex-col items-center">

            <!-- Cauldron pot -->
            <div id="cauldron-el" class="cauldron-glow relative w-44 h-36 flex flex-col items-center justify-center overflow-hidden rounded-b-full rounded-t-lg"
                 style="background:radial-gradient(ellipse at 50% 75%,#180600,#2e1000); border:3px solid #6b3410;">
              <div class="bubble-anim absolute rounded-full" style="--dur:2.1s;--del:0s;   bottom:10px;left:26px; width:10px;height:10px;background:rgba(90,200,120,.6);"></div>
              <div class="bubble-anim absolute rounded-full" style="--dur:1.7s;--del:.65s; bottom:7px; left:52px; width:7px; height:7px; background:rgba(130,180,90,.5);"></div>
              <div class="bubble-anim absolute rounded-full" style="--dur:2.5s;--del:1.1s; bottom:11px;right:28px;width:13px;height:13px;background:rgba(70,210,140,.5);"></div>
              <div class="bubble-anim absolute rounded-full" style="--dur:1.9s;--del:.3s;  bottom:6px; right:48px;width:7px; height:7px; background:rgba(150,195,70,.6);"></div>
              <div class="z-10 text-center px-2">
                <p id="cauldron-empty-msg" class="text-[#d4a73a] text-xs italic">Empty — add ingredients</p>
                <div id="cauldron-items" class="flex flex-wrap justify-center gap-1.5"></div>
                <p id="cauldron-hint" class="text-[#a0d0a0] text-xs mt-1 italic"></p>
              </div>
              <div class="absolute bottom-0 left-0 right-0 h-7 rounded-b-full opacity-25" style="background:radial-gradient(ellipse at center,rgba(80,200,130,.9),transparent);"></div>
            </div>
            <div class="w-48 h-4 rounded-full -mt-2 z-10" style="background:linear-gradient(90deg,#3a1808,#8b4c18,#6b3410,#8b4c18,#3a1808);"></div>
            <div class="flex gap-12 -mt-0.5">
              <div class="w-2.5 h-5 rounded-b" style="background:#2a0e04;"></div>
              <div class="w-2.5 h-5 rounded-b" style="background:#2a0e04;"></div>
            </div>

            <button id="mix-btn" onclick="mixPotion()"
                    class="mt-4 px-8 py-2.5 font-display text-sm tracking-widest rounded border-2 border-[#d4a73a] text-[#3a1808] transition-all hover:scale-105 active:scale-95 shadow-lg"
                    style="background:linear-gradient(135deg,#d4a73a,#e8c060);">
              ✦ MIX ✦
            </button>
            <button onclick="clearCauldron()" class="mt-2 text-xs text-[#7a5030] hover:text-[#4a2010] underline">Clear cauldron</button>
          </div>
        </div>

        <!-- Recipe list -->
        <div class="glass-parchment rounded-xl border border-[#d4b080]/60 p-4">
          <h3 class="font-display text-sm text-[#6b3410] mb-2">📋 Known Recipes</h3>
          <div id="recipe-hints" class="space-y-1.5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── EXPLORE ──────────────────────────────── -->
  <div id="tab-explore" class="tab-content hidden">

    <!-- Map — fills remaining viewport height, never collapses -->
    <div class="relative rounded-2xl overflow-hidden border-2 border-[#d4a73a]/60 shadow-2xl" style="height:calc(100vh - 120px);">

      <!-- Map video -->
      <video autoplay muted playsinline
             class="absolute inset-0 w-full h-full object-cover"
             style="filter:brightness(1) saturate(1);"
             onended="this.currentTime=this.duration; this.pause();">
        <source src="assets/map.mp4" type="video/mp4"/>
      </video>

      <!-- Hidden stubs kept for JS compat -->
      <div id="travel-options" class="hidden"></div>
      <div id="location-name-badge" class="hidden"></div>
    </div>

    <!-- Hidden stubs kept for JS compatibility -->
    <div id="location-hero" class="hidden"></div>
    <div id="location-hero-inner" class="hidden"></div>
    <div id="location-display" class="hidden"></div>
  </div>

  <!-- ── JOURNAL ──────────────────────────────── -->
  <div id="tab-journal" class="tab-content hidden">
    <div class="glass-parchment rounded-xl border border-[#d4b080]/60 p-6 mb-5">
      <h2 class="font-display text-xl text-[#6b3410] mb-1">✦ The Journal</h2>
      <p class="text-sm text-[#7a5030] italic">Some pages reveal themselves only after drinking certain potions.</p>
    </div>
    <div id="journal-entries" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <!-- ── INVENTORY ─────────────────────────────── -->
  <div id="tab-inventory" class="tab-content hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="glass-parchment rounded-xl border border-[#d4b080]/60 p-5">
        <h2 class="font-display text-lg text-[#6b3410] mb-3 pb-2 border-b border-[#d4b080]">🌿 Ingredients</h2>
        <div id="inventory-ingredients" class="space-y-2"></div>
      </div>
      <div class="glass-parchment rounded-xl border border-[#d4b080]/60 p-5">
        <h2 class="font-display text-lg text-[#6b3410] mb-3 pb-2 border-b border-[#d4b080]">🧪 Potions</h2>
        <div id="inventory-potions" class="space-y-3"></div>
      </div>
    </div>
  </div>

</main>


<!-- ════════════════ CREATURE MODAL ════════════════ -->
<div id="creature-modal" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center"
     style="background:rgba(5,2,12,0.92); backdrop-filter:blur(8px);">
  <div class="relative w-full max-w-2xl mx-4 rounded-2xl overflow-hidden border-2 border-[#9b6fd4]/60 shadow-2xl"
       style="box-shadow:0 0 60px rgba(120,60,200,0.4);">
    <video id="creature-video" autoplay muted playsinline class="w-full"
           style="display:block;"
           onended="this.pause(); this.currentTime=this.duration;">
      <source src="assets/creature.mp4" type="video/mp4"/>
    </video>
    <!-- Overlay text -->
    <div class="absolute inset-0 flex flex-col justify-end p-6"
         style="background:linear-gradient(to top,rgba(5,2,12,0.85) 0%,transparent 60%);">
      <p class="font-display text-xs tracking-[0.3em] text-[#9b6fd4] mb-1">✦ VISION ✦</p>
      <p id="creature-caption" class="font-display text-lg text-[#f5e6c8] drop-shadow-lg"></p>
      <p id="creature-sub" class="text-sm text-[#d4b080] italic mt-1"></p>
    </div>
  </div>
  <button onclick="closeCreature()"
          class="mt-5 px-8 py-2.5 font-display text-sm tracking-widest rounded border-2 border-[#9b6fd4] text-[#f5e6c8] hover:bg-[#9b6fd4]/30 transition-all">
    ✦ CLOSE ✦
  </button>
</div>

<!-- ════════════════════════════════════════════════════════════
     GAME SCRIPT
═══════════════════════════════════════════════════════════════ -->
<script>

// ╔══════════════════════════════════════════════════════════════╗
// ║  VIDEO MOOD — maps tab/location to background filter        ║
// ╚══════════════════════════════════════════════════════════════╝

// Each mood defines how the looping video looks for that scene.
// The same single video becomes three different locations through CSS filters.
const MOODS = {
  workshop:  { filter: 'brightness(0.82) saturate(1.05)',                          overlay: 'rgba(22,8,2,0.48)'  },
  glade:     { filter: 'hue-rotate(28deg) brightness(1.0) saturate(1.6)',          overlay: 'rgba(8,18,4,0.40)'  },
  ruins:     { filter: 'hue-rotate(198deg) brightness(0.42) saturate(0.35)',       overlay: 'rgba(3,5,22,0.62)'  },
  journal:   { filter: 'sepia(0.55) brightness(0.72)',                             overlay: 'rgba(18,10,4,0.60)' },
  inventory: { filter: 'brightness(0.78) saturate(0.88)',                          overlay: 'rgba(22,8,2,0.50)'  },
};

function setMood(key) {
  const m = MOODS[key] || MOODS.workshop;
  document.getElementById('bg-video').style.filter   = m.filter;
  document.getElementById('bg-overlay').style.background = m.overlay;
}

// Dev shortcut — fills every ingredient to 5 for quick testing
function devFill() {
  Object.keys(DATA.ingredients).forEach(id => { state.inventory.ingredients[id] = 5; });
  render();
  addLog('Dev: all ingredients filled ×5.', '⚗️');
}

function saveGame() { localStorage.setItem('pp_v1_save', JSON.stringify(state)); addLog('Game saved.','💾'); }

function loadGame() {
  const raw = localStorage.getItem('pp_v1_save');
  if (!raw) { addLog('No saved game found.','❌'); return; }
  try { state = JSON.parse(raw); render(); addLog('Game loaded.','💾'); }
  catch(e) { addLog('Save file corrupted — starting fresh.','❌'); newGame(true); }
}

function newGame(skipConfirm=false) {
  if (!skipConfirm && !confirm('Start a new game? All progress will be lost.')) return;
  localStorage.removeItem('pp_v1_save');
  state = deepClone(DEFAULT_STATE);
  render();
  addLog('A new adventure begins. Your cauldron is waiting.','🌟');
}

function toggleCauldronIngredient(ingId) {
  if (state.cauldron.includes(ingId)) {
    state.cauldron = state.cauldron.filter(id => id !== ingId);
  } else {
    if (state.cauldron.length >= 3) { addLog('The cauldron holds at most 3 ingredients.','🪣'); return; }
    if ((state.inventory.ingredients[ingId]||0) < 1) { addLog(`You have no ${DATA.ingredients[ingId].name}.`,'❌'); return; }
    state.cauldron.push(ingId);
  }
  renderWorkshop();
}

function clearCauldron() { state.cauldron = []; renderWorkshop(); }

function mixPotion() {
  if (state.cauldron.length === 0) { addLog('Add some ingredients to the cauldron first.','🪣'); return; }

  const el = document.getElementById('cauldron-el');
  el.classList.add('brew-shake');
  setTimeout(() => el.classList.remove('brew-shake'), 700);

  const sorted  = [...state.cauldron].sort().join(',');
  const matched = Object.values(DATA.potions).find(p => [...p.recipe].sort().join(',') === sorted);

  if (matched) {
    const needed  = {};
    state.cauldron.forEach(id => { needed[id] = (needed[id]||0)+1; });
    const hasAll  = Object.entries(needed).every(([id,n]) => (state.inventory.ingredients[id]||0) >= n);
    if (!hasAll) { addLog('Not enough ingredients in your stores.','❌'); return; }

    Object.entries(needed).forEach(([id,n]) => { state.inventory.ingredients[id] -= n; });
    state.inventory.potions[matched.id] = (state.inventory.potions[matched.id]||0) + 1;
    if (!state.brewedPotions.includes(matched.id)) state.brewedPotions.push(matched.id);

    // "All potions brewed" achievement
    if (Object.keys(DATA.potions).every(id => state.brewedPotions.includes(id))) {
      if (!state.unlockedJournal.includes('allBrewedSecret')) {
        state.unlockedJournal.push('allBrewedSecret');
        setTimeout(() => addLog('A new page has appeared in your journal...','📖'), 400);
      }
    }

    state.cauldron = [];
    addLog(`${matched.emoji} ${matched.name} brewed! ${matched.brewMsg}`,'✨');
    brewSuccess(matched);
  } else {
    // No recipe match — ingredients not consumed
    addLog('The brew fizzles. Those ingredients don\'t combine into anything known. (Ingredients returned.)','💨');
    state.cauldron = [];
  }

  saveGame(); render();
}

// ── Creature reveal ──────────────────────────────────────────
function showCreature(caption, sub, src = 'assets/creature.mp4') {
  const modal = document.getElementById('creature-modal');
  const video = document.getElementById('creature-video');
  document.getElementById('creature-caption').textContent = caption;
  document.getElementById('creature-sub').textContent     = sub;
  // Swap video source if different
  if (video.querySelector('source').src !== new URL(src, location.href).href) {
    video.querySelector('source').src = src;
    video.load();
  }
  modal.classList.remove('hidden');
  video.currentTime = 0;
  video.playbackRate = 0.6;
  video.play();
}

function closeCreature() {
  document.getElementById('creature-modal').classList.add('hidden');
  document.getElementById('creature-video').pause();
}

function drinkPotion(potionId) {
  const potion = DATA.potions[potionId];
  if (!potion || (state.inventory.potions[potionId]||0) < 1) { addLog('You don\'t have that potion.','❌'); return; }

  state.inventory.potions[potionId]--;

  if (!state.usedPotions.includes(potionId)) {
    state.usedPotions.push(potionId);
    potion.effects.flags.forEach(f => { state.flags[f] = true; });
    let unlocked = 0;
    potion.effects.journal.forEach(id => { if (!state.unlockedJournal.includes(id)) { state.unlockedJournal.push(id); unlocked++; } });
    if (unlocked > 0) setTimeout(() => addLog(`${unlocked} new journal ${unlocked>1?'entries':'entry'} unlocked!`,'📖'), 350);
    // Dream Tincture reveals the creature on first drink
    if (potionId === 'dreamTincture') {
      setTimeout(() => {
        summonLuma();
        showCreature('Luma — The Brew Sprite', 'She has lived inside the potions all along. Now she finally has a reason to emerge.');
      }, 800);
    }
    if (potionId === 'elixirOfSight') {
      setTimeout(() => showCreature('The Seeing Stone', 'The crystal holds every path not yet taken. Look closely — one of them is yours.', 'assets/crystalball.mp4'), 800);
    }
    if (potionId === 'emberbloodBrew') {
      setTimeout(() => showCreature('Emberblood', 'The fire in your veins is not yours alone. Something ancient lit this flame long before you were born.', 'assets/emberblood.mp4'), 800);
    }
  } else {
    addLog(`You've already felt the full effect of ${potion.name}. Drinking again is pleasant, but nothing new stirs.`, potion.emoji);
  }

  addLog(potion.useMsg, potion.emoji);
  saveGame(); render();
}

function gatherIngredients() {
  const loc  = DATA.locations[state.currentLocation];
  const pool = loc.ingredients;
  const min  = state.flags.hasLuck ? 2 : 1;
  const max  = state.flags.hasLuck ? 4 : 3;
  const count = Math.floor(Math.random() * (max - min + 1)) + min;
  const gathered = {};
  for (let i = 0; i < count; i++) {
    const id = pool[Math.floor(Math.random() * pool.length)];
    gathered[id] = (gathered[id]||0) + 1;
  }
  Object.entries(gathered).forEach(([id,n]) => { state.inventory.ingredients[id] = (state.inventory.ingredients[id]||0)+n; });
  state.visitCount[state.currentLocation] = (state.visitCount[state.currentLocation]||0)+1;

  const summary = Object.entries(gathered).map(([id,n]) => `${DATA.ingredients[id].emoji} ${DATA.ingredients[id].name} ×${n}`).join(', ');
  addLog(`Gathered: ${summary}${state.flags.hasLuck ? ' ✦ (Luck\'s Favor helped!)' : ''}`, '🌿');
  saveGame(); renderInventory(); renderWorkshop(); renderExplore();
}

function travelTo(locationId) {
  if (locationId === state.currentLocation) return;
  state.currentLocation = locationId;
  state.visitCount[locationId] = (state.visitCount[locationId]||0)+1;
  const loc = DATA.locations[locationId];
  setMood(loc.mood);
  addLog(`You travel to ${loc.name}.`, loc.emoji);
  saveGame();
  // Map stays open — only update the hidden stubs, no full re-render
}

function addLog(msg, icon='✦') {
  const log = document.getElementById('action-log');
  const div = document.createElement('div');
  div.className = 'text-xs text-[#d4b080] fade-up border-b border-white/5 pb-0.5';
  div.textContent = `${icon}  ${msg}`;
  log.insertBefore(div, log.firstChild);
  while (log.children.length > 30) log.removeChild(log.lastChild);

// ── Workshop ─────────────────────────────────────────────────
function renderWorkshop() {
  const shelf = document.getElementById('workshop-ingredients');
  shelf.innerHTML = '';

  Object.values(DATA.ingredients).forEach(ing => {
    const count    = state.inventory.ingredients[ing.id] || 0;
    const selected = state.cauldron.includes(ing.id);
    const full     = state.cauldron.length >= 3 && !selected;
    const disabled = count === 0 || full;

    const card = document.createElement('div');
    card.className = `ing-card rounded-lg border p-3 ${selected ? 'ing-selected border-[#d4a73a] bg-[#fdf3dc]/90' : 'border-[#d4b080]/60 bg-[#fdf3dc]/75'} ${disabled ? 'ing-disabled' : ''}`;
    card.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="text-2xl leading-none">${ing.emoji}</span>
        <div class="flex-1 min-w-0">
          <p class="font-display text-xs text-[#5c3018] leading-snug truncate">${ing.name}</p>
          <p class="text-xs text-[#8b6040]">×${count}</p>
        </div>
        ${selected ? '<span class="text-[#d4a73a] font-bold">✓</span>' : ''}
      </div>`;
    if (!disabled) card.onclick = () => toggleCauldronIngredient(ing.id);
    shelf.appendChild(card);
  });

  // Cauldron contents
  const emptyMsg = document.getElementById('cauldron-empty-msg');
  const itemsDiv = document.getElementById('cauldron-items');
  const hintDiv  = document.getElementById('cauldron-hint');
  itemsDiv.innerHTML = '';

  if (state.cauldron.length === 0) {
    emptyMsg.style.display = 'block';
    hintDiv.textContent = '';
  } else {
    emptyMsg.style.display = 'none';
    state.cauldron.forEach((id, idx) => {
      const span = document.createElement('span');
      span.className = 'text-2xl cursor-pointer hover:opacity-60 transition-opacity leading-none';
      span.title = `${DATA.ingredients[id].name} — click to remove`;
      span.textContent = DATA.ingredients[id].emoji;
      span.onclick = () => { state.cauldron.splice(idx,1); renderWorkshop(); };
      itemsDiv.appendChild(span);
    });
    const preview = getRecipePreview();
    hintDiv.textContent = preview.type === 'match' ? `→ ${preview.potion.name}` : preview.type === 'partial' ? 'Partial match…' : '';
  }

  renderRecipeHints();
}

function getRecipePreview() {
  const sorted = [...state.cauldron].sort().join(',');
  for (const p of Object.values(DATA.potions)) if ([...p.recipe].sort().join(',') === sorted) return { type:'match', potion:p };
  for (const p of Object.values(DATA.potions)) if (state.cauldron.every(id => p.recipe.includes(id))) return { type:'partial', potion:p };
  return { type:'none' };
}

function renderRecipeHints() {
  const div = document.getElementById('recipe-hints');
  div.innerHTML = '';
  Object.values(DATA.potions).forEach(p => {
    const brewed = state.brewedPotions.includes(p.id);
    const row = document.createElement('div');
    row.className = 'flex items-center gap-1.5 text-xs';
    row.innerHTML = `<span>${p.emoji}</span><span class="text-[#6b3410] ${brewed?'line-through opacity-50':''}">${p.name}</span><span class="text-[#9a7050] ml-1">${p.recipe.map(id=>DATA.ingredients[id].emoji).join('+')}</span>${brewed?'<span class="text-green-700 ml-auto">✓</span>':''}`;
    div.appendChild(row);
  });
}

      : 'text-shadow:0 2px 6px rgba(0,0,0,0.6);';
    const labelStyle = isCurrent
      ? 'text-shadow:0 0 8px rgba(255,220,100,0.9),0 1px 2px rgba(255,255,255,0.5); color:#2a1200;'
      : 'text-shadow:0 1px 4px rgba(255,255,255,0.5),0 2px 6px rgba(0,0,0,0.4); color:#2a1200;';
    btn.innerHTML = `
      <span class="text-4xl leading-none" style="${pinStyle}">${dest.emoji}</span>
      <p class="font-display text-xs tracking-wide" style="${labelStyle}">${dest.name}</p>
      ${isCurrent ? `<span style="color:#c47800;font-size:10px;font-family:'Cinzel',serif;text-shadow:0 0 6px rgba(255,200,50,0.8);">★ Here</span>` : ''}`;
    btn.onclick = () => travelTo(destId);
    travelDiv.appendChild(btn);
  });

  document.getElementById('location-name-badge').textContent = loc.name;
}

// ── Journal ──────────────────────────────────────────────────
function renderJournal() {
  const container = document.getElementById('journal-entries');
  container.innerHTML = '';
  DATA.journal.forEach(entry => {
    const visible  = entry.alwaysVisible || state.unlockedJournal.includes(entry.id);
    const expanded = state.expandedJournal.includes(entry.id);
    const card = document.createElement('div');
    card.className = 'glass-parchment rounded-xl border border-[#d4b080]/60 p-4 fade-up transition-all';

    if (visible) {
      const formatted = entry.content.split('\n\n')
        .map(p => `<p class="mb-2">${p.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')}</p>`)
        .join('');
      card.innerHTML = `
        <div class="flex items-start gap-3 cursor-pointer hover:opacity-80 transition-opacity" onclick="toggleJournal('${entry.id}')">
          <span class="text-2xl leading-none">${entry.emoji}</span>
          <div class="flex-1 min-w-0">
            <h3 class="font-display text-sm text-[#5c3018] leading-snug">${entry.title}</h3>
            <p class="text-xs text-[#8b6040] mt-0.5">${entry.date}</p>
          </div>
          <span class="text-[#8b6040] text-xs mt-1 shrink-0">${expanded?'▲':'▼'}</span>
        </div>
        ${expanded ? `<div class="mt-3 pt-3 border-t border-[#d4b080] text-sm leading-relaxed text-[#3a2010] fade-up">${formatted}</div>` : ''}`;
    } else {
      let hint = 'Unknown';
      if (entry.unlockRequires === 'allPotions') hint = 'Brew all six potions';
      else if (entry.unlockRequires && DATA.potions[entry.unlockRequires]) hint = `Drink ${DATA.potions[entry.unlockRequires].name}`;
      card.innerHTML = `
        <div class="flex items-start gap-3 opacity-55">
          <span class="text-2xl leading-none">🔒</span>
          <div class="flex-1 min-w-0">
            <h3 class="font-display text-sm text-[#5c3018] leading-snug journal-blur">${entry.title}</h3>
            <p class="text-xs text-[#8b6040] mt-1 italic">Unlock by: ${hint}</p>
          </div>
        </div>`;
    }
    container.appendChild(card);
  });
}

// ── Inventory ─────────────────────────────────────────────────
function renderInventory() {
  const ingDiv = document.getElementById('inventory-ingredients');
  ingDiv.innerHTML = '';
  const ownedIngs = Object.values(DATA.ingredients).filter(i => (state.inventory.ingredients[i.id]||0) > 0);
  if (!ownedIngs.length) {
    ingDiv.innerHTML = '<p class="text-sm text-[#7a5030] italic">Your stores are empty. Go explore!</p>';
  } else {
    ownedIngs.forEach(ing => {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-3 rounded-lg border border-[#d4b080]/60 bg-[#fdf3dc]/75 p-3 fade-up';
      row.innerHTML = `<span class="text-2xl leading-none">${ing.emoji}</span><div class="flex-1 min-w-0"><p class="font-display text-sm text-[#5c3018]">${ing.name}</p><p class="text-xs text-[#8b6040] italic truncate">${ing.desc}</p></div><span class="font-display text-lg text-[#d4a73a] shrink-0">×${state.inventory.ingredients[ing.id]}</span>`;
      ingDiv.appendChild(row);
    });
  }

  const potDiv = document.getElementById('inventory-potions');
  potDiv.innerHTML = '';
  const ownedPots = Object.values(DATA.potions).filter(p => (state.inventory.potions[p.id]||0) > 0);
  if (!ownedPots.length) {
    potDiv.innerHTML = '<p class="text-sm text-[#7a5030] italic">No potions brewed yet. Visit the Workshop!</p>';
  } else {
    ownedPots.forEach(potion => {
      const alreadyUsed = state.usedPotions.includes(potion.id);
      const card = document.createElement('div');
      card.className = 'rounded-lg border border-[#d4b080]/60 bg-[#fdf3dc]/80 p-4 fade-up';
      card.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="text-2xl leading-none">${potion.emoji}</span>
          <div class="flex-1 min-w-0">
            <p class="font-display text-sm text-[#5c3018]">${potion.name} <span class="text-[#d4a73a]">×${state.inventory.potions[potion.id]}</span></p>
            <p class="text-xs text-[#8b6040] italic mb-3">${potion.desc}</p>
            <button onclick="drinkPotion('${potion.id}')"
                    class="px-4 py-1.5 font-display text-xs tracking-wide rounded border border-[#d4a73a] text-[#3a1808] hover:scale-105 active:scale-95 transition-all shadow"
                    style="background:linear-gradient(135deg,#f0d080,#d4a73a);">
              Drink ${alreadyUsed ? '(again)' : ''}
            </button>
          </div>
        </div>`;
      potDiv.appendChild(card);
    });
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║  TAB SWITCHING                                               ║
// ╚══════════════════════════════════════════════════════════════╝

function goHome() {
  // Show landing, hide all tabs, restore the bright video
  document.getElementById('landing').classList.remove('hidden');
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('bg-video').style.filter   = 'brightness(0.92) saturate(1.05)';
  document.getElementById('bg-overlay').style.background = 'rgba(8,3,1,0.15)';
}

function switchTab(name) {
  // Hide landing screen once any tab is chosen
  document.getElementById('landing').classList.add('hidden');
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.remove('hidden');
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');

  // Set video mood per tab; Explore uses the current location's mood
  if (name === 'explore') {
    setMood(DATA.locations[state.currentLocation].mood);
    renderExplore();
  } else {
    setMood(name);
    if (name === 'workshop')  renderWorkshop();
    if (name === 'journal')   renderJournal();
    if (name === 'inventory') renderInventory();
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║  INIT                                                        ║
// ╚══════════════════════════════════════════════════════════════╝

(function init() {
  const raw = localStorage.getItem('pp_v1_save');
  if (raw) { try { state = JSON.parse(raw); } catch(e) {} }
  // Restore Luma if she was already summoned in a previous session
  if (state.usedPotions.includes('dreamTincture')) {
    const sprite = document.getElementById('luma-sprite');
    sprite.classList.remove('hidden');
    sprite.style.animation = 'lumaFloat 3s ease-in-out infinite, lumaGlow 3s ease-in-out infinite';
  }
  // Landing: let the video breathe with minimal darkening
  document.getElementById('bg-video').style.filter   = 'brightness(0.92) saturate(1.05)';
  document.getElementById('bg-overlay').style.background = 'rgba(8,3,1,0.15)';
  render();
  addLog('Welcome, Crafter. The workshop is warm and the cauldron is ready.','🧪');
})();
</script>
